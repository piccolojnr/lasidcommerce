name: backthred

services:
  app:
    image: ${BACKTHRED_IMAGE_PREFIX:-ghcr.io/piccolojnr/backthred}/app:${BACKTHRED_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${BACKTHRED_COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${BACKTHRED_DOCKER_DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-backthred}
      DB_USERNAME: ${DB_USERNAME:-backthred}
      DB_PASSWORD: ${DB_PASSWORD:-backthred}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-default}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backthred_storage:/var/www/html/storage
    networks:
      - backthred

  web:
    image: ${BACKTHRED_IMAGE_PREFIX:-ghcr.io/piccolojnr/backthred}/web:${BACKTHRED_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - backthred_storage:/var/www/html/storage:ro
    networks:
      - backthred

  queue:
    image: ${BACKTHRED_IMAGE_PREFIX:-ghcr.io/piccolojnr/backthred}/app:${BACKTHRED_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${BACKTHRED_COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${BACKTHRED_DOCKER_DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-backthred}
      DB_USERNAME: ${DB_USERNAME:-backthred}
      DB_PASSWORD: ${DB_PASSWORD:-backthred}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-default}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - backthred_storage:/var/www/html/storage
    networks:
      - backthred

  scheduler:
    image: ${BACKTHRED_IMAGE_PREFIX:-ghcr.io/piccolojnr/backthred}/app:${BACKTHRED_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${BACKTHRED_COMPOSE_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${BACKTHRED_DOCKER_DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-backthred}
      DB_USERNAME: ${DB_USERNAME:-backthred}
      DB_PASSWORD: ${DB_PASSWORD:-backthred}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_CONNECTION: ${SESSION_CONNECTION:-default}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - backthred_storage:/var/www/html/storage
    networks:
      - backthred

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-backthred}
      POSTGRES_USER: ${DB_USERNAME:-backthred}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-backthred}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-backthred} -d ${DB_DATABASE:-backthred}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - backthred_database:/var/lib/postgresql/data
    networks:
      - backthred

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - ${BACKTHRED_COMPOSE_ENV_FILE:-.env}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else redis-server --appendonly yes; fi'
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ] && [ \"$${REDIS_PASSWORD}\" != \"null\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - backthred_redis:/data
    networks:
      - backthred

volumes:
  backthred_database:
    external: true
    name: docker_backthred_database
  backthred_redis:
    external: true
    name: docker_backthred_redis
  backthred_storage:
    external: true
    name: docker_backthred_storage

networks:
  backthred:
    driver: bridge
