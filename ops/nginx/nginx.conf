server {
    listen 80;
    listen [::]:80;
    server_name lasid_admin.ri-tech.tech www.lasid_admin.ri-tech.tech;

    root /var/www/staging/lasid_admin/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    access_log /var/log/nginx/lasid_admin_access.log;
    error_log /var/log/nginx/lasid_admin_error.log;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 512k;
        fastcgi_buffers 16 512k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|map)$ {
        expires 7d;
        access_log off;
    }
}